<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Earthquake Visualizations</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>

  <h1>USGS Earthquake Data (M 4.5+ past day)</h1>

  <div class="chart">
    <h2>1. Count of Earthquakes by Magnitude</h2>
    <svg id="bar-chart"></svg>
  </div>

  <div class="chart">
    <h2>2. Earthquake Locations (by Latitude & Longitude)</h2>
    <svg id="map-chart"></svg>
  </div>

  <div class="chart">
    <h2>3. Earthquake Details</h2>
    <table id="quake-table">
      <thead>
        <tr><th>Place</th><th>Magnitude</th><th>Time</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="visual.js"></script>
</body>
</html>
